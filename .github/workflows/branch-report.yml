# Weekly report of branches other than main/staging. Reports only - never deletes.
name: Branch report

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: List stray branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra="$(gh api "repos/$GITHUB_REPOSITORY/branches" --paginate --jq '.[] | "\(.name) \(.commit.sha)"' | grep -vE '^(main|staging) ' || true)"
          {
            echo "### Branch report"
            if [ -z "$extra" ]; then echo "Only main and staging exist."; else echo "Stray branches (not deleted):"; echo '```'; echo "$extra"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$extra" ] || echo "::warning title=branch-report::Stray branches: $(echo "$extra" | cut -d' ' -f1 | tr '\n' ' ')"
